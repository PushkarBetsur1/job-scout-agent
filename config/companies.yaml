settings:
  timezone: America/New_York
  digest_hours: [9, 18]          # local times for the daily digests
  instant_threshold: 90          # score >= this -> immediate Telegram alert
  instant_alert_companies:
    - AMD
    - Advanced Micro Devices
    - Advanced Micro Devices, Inc.
    - Qualcomm
    - Qualcomm Incorporated
    - Intel
    - Intel Corporation
    - Saronic
    - Lam Research
    - Lam Research Corporation
    - GM
    - General Motors
    - General Motors Company
  digest_threshold: 80           # hardware/embedded/semiconductor roles: score >= this -> next digest
  degree_match_threshold: 65     # other roles that accept a Computer Engineering degree: score >= this -> next digest
  max_instant_alerts_per_run: 10 # overflow goes to the digest
  max_llm_jobs_per_run: 40       # Gemini free tier allows ~1,000 requests/day; 40/hour stays under it
  max_age_days: 14               # ignore postings older than this (when the date is known)
  llm_provider: gemini           # gemini (free tier, GEMINI_API_KEY) or openai (paid, OPENAI_API_KEY)
  llm_model: gemini-flash-lite-latest  # for openai use e.g. gpt-4o-mini; override with LLM_MODEL secret
  llm_min_seconds_between_calls: 5     # keeps under the free tier's per-minute limit
  resume_path: resume/resume.pdf
  collector_workers: 8           # sources fetched in parallel
  detail_workers: 12             # job descriptions fetched in parallel
  workday_search_terms:
    - new grad
    - college graduate
    - university graduate
    - entry level
    - early career
  workday_max_pages: 2           # 20 results per page per search term
  preferences: |
    Target roles: new-grad / early-career (0-2 years) hardware engineering, embedded systems,
    firmware, computer engineering, and semiconductor roles (digital/ASIC/FPGA design, design
    verification, silicon validation, DFT, product/test engineering, embedded software).
    Also open to other engineering/software roles that accept a Computer Engineering degree.
    Location: anywhere in the United States, including remote.

# ats: workday | greenhouse | lever | ashby | eightfold | smartrecruiters | amazon | jibe | themuse
#      | simplify | readme_table | adzuna | usajobs
# semiconductor: true -> any engineering title at this company counts as relevant
companies:
