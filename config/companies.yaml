    url: https://raw.githubusercontent.com/speedyapply/2026-SWE-College-Jobs/main/NEW_GRAD_USA.md
  - name: Zapply Hardware New Grad
    ats: readme_table
    url: https://raw.githubusercontent.com/zapplyjobs/New-Grad-Hardware-Engineering-Jobs-2026/main/README.md
  - name: Zapply Software New Grad
    ats: readme_table
    url: https://raw.githubusercontent.com/zapplyjobs/New-Grad-Software-Engineering-Jobs-2026/main/README.md
  - name: Jobright Engineering New Grad
    ats: readme_table
    url: https://raw.githubusercontent.com/jobright-ai/2026-Engineering-New-Grad/master/README.md
  - name: Jobright Software New Grad
    ats: readme_table
    url: https://raw.githubusercontent.com/jobright-ai/2026-Software-Engineer-New-Grad/master/README.md
  - name: The Muse (entry level)
    ats: themuse
    categories: [Science and Engineering, Software Engineering]
  # Optional, need free API keys (see README); skipped automatically without them
  - {name: Adzuna, ats: adzuna}
  - {name: USAJOBS (recent graduates), ats: usajobs}

